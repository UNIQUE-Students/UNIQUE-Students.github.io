- fullname: Francis Gingras
  email: none
  photo: francis_gingras.jpg
  affiliation: "Université de Montréal"
  bio: "I completed my Ph.D. at UQAM in 2026 in the Department of Psychology, with specializations in Neuropsychology/Biopsychology and Cognitive Science, and now work as a postdoctoral researcher at the University of Montreal under the supervision of Professor Ian Charest. I am interested in developing and analyzing large neural datasets (fMRI/EEG/MEG) to better understand visual cognition at all levels. My research interests include visual psychophysics, face perception, cognitive neuroscience and cultural psychology. Since 2024, I am also a staff scientist for VPixx Technologies Inc., where I work closely with the research team to investigate how to track visual attention using EEG, as well as with the software development team to produce useful software for research teams, handling experiment building as well as research hardware control.<br><br>Outside of research, I have 5 years of experience as a lecturer, teaching courses on statistics, research methods and neuropsychology, and have worked on the organization of multiple research conferences such as the Société Québécoise pour la Recherche en Psychologie and the Culture & Cognition Preconference."
  committee: Event Organiser
  alttext: none
  pronouns: he/him

- fullname: Emmanuelle Coutu-Nadeau
  email: emmanuelle.coutu-nadeau@umontreal.ca
  photo: emmanuelle_coutu-nadeau_2027.jpg
  affiliation: "Université de Montréal"
  bio: "I'm a psychology PhD student supervised by Dr. Sarah Lippé (CHU Sainte-Justine). I specialize in the clinical applications of artificial intelligence to identify transdiagnostic behavioral and neurophysiological profiles in autism and ADHD. I have a background in software engineering (B. Eng.) and experience in digital health as a software developer and project manager at CareSimple.<br><br>Outside of research, I am a Crisis Responder for Kids Help Phone, a mentor for Technovation and a board member of La Fondation de la Maison du Père."
