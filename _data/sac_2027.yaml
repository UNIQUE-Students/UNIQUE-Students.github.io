- fullname: Elisa Corti
  email: none
  photo: elisa_corti.jpg
  affiliation: "CERVO Brain Research Centre, Université Laval"
  bio: "I have obtained my Ph.D. in 2025 in Experimental Biology and Biomedicine (specialization in Neuroscience) at the University of Coimbra, where I investigated the role of FMRP in synaptogenesis and synaptic plasticity. I am currently a postdoctoral fellow in the group led by prof Flavie Lavoie-Cardinal at CERVO brain research center. I am interested in how changes in the synaptic proteome shape the expression and modulation of synaptic plasticity in the healthy brain, but also in aging and in neurodevelopmental disorders. Moreover, I am deeply enthusiastic about superresolution microscopy and live imaging.<br><br>In my free time I enjoy jigsaw puzzles, boardgames, cooking and baking, under the supervision of my cat Vivi."
  committee: Quebec Community Coordinator
  alttext: none
  pronouns: she/her
