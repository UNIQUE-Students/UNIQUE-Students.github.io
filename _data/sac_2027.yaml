  bio: "I’m a PhD student in Neuroscience at Université de Montréal, affiliated with Mila. My research focuses on understanding the neural mechanisms underlying perception, particularly multisensory processing, using complementary approaches including behavioral experiments, neuroimaging (EEG, MEG, MRI), and computational modeling. I’m also particularly interested in translational research, bridging fundamental discoveries and clinical applications."
