  bio: "I am currently a master’s student in psychology at the Université de Montréal, under the supervision of Lune Bellec. My research interests are in computational cognitive science. I am working on developing behavioral analyses using unsupervised learning techniques. I use video games as a setting to explore these questions. I am also a fan of underground rap and emo music. My favorite artist from Quebec is Lydia Képinski."
