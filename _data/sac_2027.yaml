  bio: "I am a first year neuroscience PhD student working on decision-making with Dr. Becket Ebitz at Université de Montréal. I’m currently working on understanding how energetic states influence cognitive flexibility and decision-making, combining behavioral, physiological and computational approaches. I’m also interested in value representations at the human level, and how these representations shape our behavioral choices."
